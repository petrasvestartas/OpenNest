# Render Blueprint for the OpenNest web service (src/opennest_service).
# Render: New > Blueprint > this repository. Render builds src/opennest_service/deploy/Dockerfile,
# terminates HTTPS itself (no Caddy here) and keeps the SQLite database and job files on the disk.
#
# The plan sets the compute every customer job gets: nesting quality grows with the threads a job has,
# so pick CPUs, not RAM (the solver needs well under 1 GB for typical jobs).
services:
  - type: web
    name: opennest
    runtime: docker
    plan: free                   # TEST: 0.1 CPU, sleeps after 15 min idle, NO disk (see below).
                                 # For selling: 8c-16g (8 CPUs), add the disk back, THREADS_PER_JOB 6.
    region: frankfurt
    dockerfilePath: ./src/opennest_service/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # The free plan allows no persistent disk, so /data (SQLite: accounts, credits, results) is wiped
    # whenever the service sleeps, restarts or redeploys. On a paid plan, put this back:
    # disk:                      # one disk = one instance; a deploy restarts it (running jobs are refunded)
    #   name: opennest-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: PORT                # the Dockerfile listens on 8080
        value: "8080"
      - key: OPENNEST_TRUST_PROXY
        value: "1"
      - key: OPENNEST_SLOTS
        value: "1"
      - key: OPENNEST_THREADS_PER_JOB
        value: "1"               # ~75% of the plan's CPUs (6 for 8c-16g); change together with `plan`
      - key: OPENNEST_PASSWORD
        generateValue: true      # read it in the dashboard (Environment)
      - key: OPENNEST_PUBLIC_URL
        sync: false              # https://opennest.onrender.com or your custom domain, no trailing slash
