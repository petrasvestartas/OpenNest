name: Build & Publish (Windows + macOS -> Yak)

# Bumps the version ONCE, builds every engine from source on BOTH platforms, then packages and pushes the
# OpenNest Yak distributions at the same version (…-any-win / …-any-mac): Grasshopper 1 + the OpenNest Rhino
# command auto-install on Rhino 8/9/later. The Grasshopper 2 plug-in is NOT a separate auto-loading package
# (Rhino's plug-in manager crashes on a registered GH2 .rhp); instead its files ride inside each package's
# grasshopper2/ subfolder as a manual-load download. Refreshes the committed grasshopper_plugin/ packages,
# tags, and creates a GitHub Release.
# A plugin with platform-specific native binaries (.dll on Windows, .dylib on macOS) MUST ship as separate
# per-OS Yak packages — `yak build --platform win|mac` sets the platform tag (see the Yak CLI reference).
# Add a repo secret YAK_TOKEN (from `yak login --ci`) to enable the push step.
on:
  # Auto-publish on every push to main (the version bumps each time — that's intended).
  # The release commit this job makes is tagged "[skip ci]", which GitHub honours for push
  # events, so the bump commit never re-triggers the workflow (no infinite loop).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump (manual runs only; push always bumps minor)"
        type: choice
        default: minor
        options: [minor, patch, major]

permissions:
  contents: write   # push the version-bump commit + tag, and create the GitHub Release

# Serialize publishes so rapid pushes don't race on the version bump / git push (they queue, not cancel).
concurrency:
  group: publish-yak
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------------
  # 1) macOS: build the three engines as UNIVERSAL dylibs (Intel x86_64 + Apple Silicon arm64) and upload
  #    them. The Windows job then assembles the -mac Yak package with yak.exe (yak can tag either platform).
  # ---------------------------------------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native engines (universal x86_64 + arm64)
        run: |
          set -e
          ARCH="-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
          cmake -S src/opennest_cpp     -B src/opennest_cpp/build     -DCMAKE_BUILD_TYPE=Release "$ARCH"
          cmake --build src/opennest_cpp/build --target nfp_nest -j3
          cmake -S src/nest_physics_cpp -B src/nest_physics_cpp/build -DCMAKE_BUILD_TYPE=Release "$ARCH"
          cmake --build src/nest_physics_cpp/build --target nest_physics -j3
          cmake -S src/nest_spectral_cpp -B src/nest_spectral_cpp/build -DCMAKE_BUILD_TYPE=Release "$ARCH"
          cmake --build src/nest_spectral_cpp/build --target nest_spectral -j3

      - name: Stage + verify universal dylibs (must list arm64 + x86_64)
        run: |
          set -e
          mkdir -p mac_out
          cp src/opennest_cpp/build/nfp_nest.dylib          mac_out/
          cp src/nest_physics_cpp/build/nest_physics.dylib  mac_out/
          cp src/nest_spectral_cpp/build/nest_spectral.dylib mac_out/
          for f in mac_out/*.dylib; do echo "== $f =="; lipo -archs "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dylibs
          path: mac_out/*.dylib
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------------
  # 2) Windows: build the Windows libs + the .gha, then package & push BOTH Yak distributions
  #    (win from this build; mac from the artifact above — yak.exe can tag either platform).
  # ---------------------------------------------------------------------------------------------------
  windows:
    needs: mac
    runs-on: windows-latest
    # Expose the secret as an env var so the push step's `if:` can test it (the `secrets` context is not
    # allowed in `if:` — that would make the workflow file invalid).
    env:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1) Bump the version in BOTH manifests (the win manifest is canonical) ----
      - name: Bump version
        id: ver
        shell: pwsh
        run: |
          $win = "grasshopper_plugin/opennest_win/manifest.yml"
          $mac = "grasshopper_plugin/opennest_mac/manifest.yml"
          # Single OpenNest package (GH1 + command). The Grasshopper 2 files ride inside its grasshopper2/
          # subfolder as a manual-load download — no separate OpenNest_GH2 package any more.
          $manifests = @($win, $mac)
          $c = Get-Content $win -Raw
          if ($c -notmatch 'version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)') { throw "version not found in $win" }
          $base = [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])"
          # Never publish a duplicate: start from the HIGHER of the committed manifest and the version already
          # live on Yak for EITHER package (a prior run can push to Yak but fail to commit the bump after a race).
          foreach ($pkg in @("opennest")) {
            try {
              $y = (Invoke-RestMethod -Uri "https://yak.rhino3d.com/packages/$pkg" -TimeoutSec 20).version
              if ($y -match '([0-9]+)\.([0-9]+)\.([0-9]+)') {
                $yv = [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])"
                if ($yv -gt $base) { $base = $yv }
              }
            } catch { Write-Host "Yak version query failed for $pkg; ignoring. $_" }
          }
          $maj=$base.Major; $min=$base.Minor; $pat=$base.Build
          switch ("${{ github.event.inputs.bump }}") {
            "major" { $maj++; $min=0; $pat=0 }
            "patch" { $pat++ }
            default { $min++; $pat=0 }   # minor
          }
          $new = "$maj.$min.$pat.0"
          foreach ($m in $manifests) {
            (Get-Content $m -Raw) -replace 'version:\s*[0-9.]+', "version: $new" | Set-Content $m -NoNewline
          }
          "version=$new" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "New version: $new"

      # ---- 2) Toolchains (CMake + VS 2022 + MSVC are preinstalled on windows-latest) ----
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---- 3) Build the three native engines FROM SOURCE (Windows x64) ----
      - name: Build nfp_nest.dll
        run: |
          cmake -S src/opennest_cpp -B src/opennest_cpp/build -A x64
          cmake --build src/opennest_cpp/build --config Release --target nfp_nest

      - name: Build nest_physics.dll
        run: |
          cmake -S src/nest_physics_cpp -B src/nest_physics_cpp/build -A x64
          cmake --build src/nest_physics_cpp/build --config Release --target nest_physics

      - name: Build nest_spectral.dll
        run: |
          cmake -S src/nest_spectral_cpp -B src/nest_spectral_cpp/build -A x64
          cmake --build src/nest_spectral_cpp/build --config Release --target nest_spectral

      # ---- 4) Build the plugin (all TFMs); PostBuild copies the Windows DLLs next to each .gha ----
      - name: Build opennest_2.gha
        run: dotnet build src/opennest_2/opennest_2.csproj -c Release

      # ---- 4b) Build the Rhino COMMAND plug-in (.rhp). A .gha cannot expose Rhino commands, so the
      #          OpenNest2 / OpenNestCollision commands ship as a SEPARATE .rhp that reuses opennest_2's
      #          code (project reference) and is dropped into the SAME Yak folder below, so one install
      #          delivers both the Grasshopper components and the Rhino commands. ----
      - name: Build opennest_commands.rhp
        run: dotnet build src/opennest_commands/opennest_commands.csproj -c Release

      # ---- 4c) Build the Grasshopper 2 plug-in (.rhp) for RHINO 9 (net8.0-windows + net8.0). It compiles
      #          against the Rhino-9 GH2 SDK (Grasshopper2 9.0.x-wip NuGet -> pinned RhinoCommon 9.x). The
      #          net8.0 (portable) flavor is then staged into each OpenNest package's grasshopper2/ subfolder
      #          (steps 6/7) as a manual-load download — it is NOT registered as a Rhino plug-in, because
      #          Rhino's plug-in manager crashes on a registered GH2 .rhp (InternalOnLoad NRE). continue-on-
      #          error: the GH2 SDK is still WIP — never let a GH2 hiccup block the proven GH1 + commands
      #          release; the staging steps guard on the .rhp existing (no .rhp => no grasshopper2/ subfolder,
      #          main OpenNest still ships). ----
      - name: Build opennest_gh2.rhp (Grasshopper 2, Rhino 9)
        continue-on-error: true
        run: dotnet build src/opennest_gh2/opennest_gh2.csproj -c Release

      # ---- 5) Pull the universal macOS dylibs built by the mac job ----
      - name: Download macOS dylibs
        uses: actions/download-artifact@v4
        with:
          name: mac-dylibs
          path: mac_dylibs

      - name: Install Yak CLI
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://files.mcneel.com/yak/tools/latest/yak.exe" -OutFile "$PWD/yak.exe"

      # ---- 6) Build ALL FOUR OpenNest Yak distributions: {Rhino 8 = net7/RC8, Rhino 9 = net8/RC9} x
      #         {win, mac}. SAME package name + version, four distribution tags — Rhino's Package Manager
      #         installs the one matching the running Rhino, so GH1 (.gha) + the OpenNest command (.rhp)
      #         auto-install on Rhino 8 AND 9, on Windows AND macOS. The Grasshopper 2 plug-in is NEVER in the
      #         package root (Rhino's plug-in manager would register it and crash:
      #         Rhino.PlugIns.PlugIn.InternalOnLoad NRE); it rides in the "grasshopper2/" SUBFOLDER as a plain
      #         download the user loads by hand inside Grasshopper 2 (Rhino 9 only). The command MUST match the
      #         Rhino runtime: a net7/RC8 .rhp can't load on Rhino 9, so the rh9 packages ship the net8/RC9
      #         command. yak infers the distribution tag from the inspected plug-in; we force it by rename
      #         (guide-sanctioned) since we KNOW which Rhino each staging targets. ----
      - name: Build OpenNest Yak packages (R8+R9, win+mac)
        shell: pwsh
        run: |
          $yak = "$env:GITHUB_WORKSPACE/yak.exe"
          function Build-Pkg($stage, $platform, $rh, $ghaDir, $cmdDir, $manifestDir, $useDylibs) {
            New-Item -ItemType Directory -Force $stage | Out-Null
            # GH1 payload (managed deps included). On mac, drop the Windows-native DLLs the PostBuild copied in
            # and ship the universal dylibs instead.
            Copy-Item "$ghaDir/*" $stage -Recurse -Force
            if ($useDylibs) {
              Remove-Item "$stage/nfp_nest.dll","$stage/nest_physics.dll","$stage/nest_spectral.dll" -Force -ErrorAction SilentlyContinue
              Copy-Item "mac_dylibs/*.dylib" $stage -Force
            }
            # Rhino command — net7/RC8 for the rh8 package, net8/RC9 for the rh9 package (runtimeconfig.json
            # must be present for the .NET plug-in to start).
            Copy-Item "$cmdDir/opennest_commands.rhp" $stage -Force
            Copy-Item "$cmdDir/opennest_commands.deps.json" $stage -Force -ErrorAction SilentlyContinue
            Copy-Item "$cmdDir/opennest_commands.runtimeconfig.json" $stage -Force -ErrorAction SilentlyContinue
            # GH2 manual-load subfolder: the net8 (portable) .rhp + GH1 payload + engines beside it.
            if (Test-Path "src/opennest_gh2/bin/Release/net8.0/opennest_gh2.rhp") {
              $g2 = "$stage/grasshopper2"; New-Item -ItemType Directory -Force $g2 | Out-Null
              Copy-Item "src/opennest_gh2/bin/Release/net8.0/opennest_gh2.rhp" $g2 -Force
              Copy-Item "src/opennest_gh2/bin/Release/net8.0/opennest_gh2.deps.json" $g2 -Force -ErrorAction SilentlyContinue
              Copy-Item "src/opennest_gh2/bin/Release/net8.0/opennest_gh2.runtimeconfig.json" $g2 -Force -ErrorAction SilentlyContinue
              Copy-Item "$ghaDir/opennest_2.gha" $g2 -Force
              if ($useDylibs) { Copy-Item "mac_dylibs/*.dylib" $g2 -Force }
              else { Copy-Item "$ghaDir/nest_physics.dll" $g2 -Force; Copy-Item "$ghaDir/nfp_nest.dll" $g2 -Force; Copy-Item "$ghaDir/nest_spectral.dll" $g2 -Force }
              Copy-Item "grasshopper_plugin/GRASSHOPPER2_INSTALL.txt" $g2 -Force -ErrorAction SilentlyContinue
            }
            Copy-Item "$manifestDir/manifest.yml" $stage -Force
            Copy-Item "$manifestDir/icon.png" $stage -Force
            if (Test-Path "README.md") { Copy-Item "README.md" "$stage/" -Force }
            if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   "$stage/" -Force }
            Push-Location $stage
            & $yak build --platform $platform
            Pop-Location
            Get-ChildItem "$stage/*.yak" | ForEach-Object {
              $n = $_.Name -replace '-(any|rh[0-9_]+)-(win|mac|any)\.yak$', "-$rh-`$2.yak"
              if ($n -ne $_.Name) { Rename-Item $_.FullName $n; Write-Host "Retagged $($_.Name) -> $n" }
            }
            Get-ChildItem "$stage/*.yak" | Select-Object Name
          }
          if (-not (Test-Path "src/opennest_gh2/bin/Release/net8.0/opennest_gh2.rhp")) { Write-Host "WARNING: GH2 .rhp missing - packages will ship without the grasshopper2/ subfolder." }
          Build-Pkg "yak_win_rh8" "win" "rh8_0" "src/opennest_2/bin/Release/net7.0-windows" "src/opennest_commands/bin/Release/net7.0-windows" "grasshopper_plugin/opennest_win" $false
          Build-Pkg "yak_win_rh9" "win" "rh9_0" "src/opennest_2/bin/Release/net7.0-windows" "src/opennest_commands/bin/Release/net8.0-windows" "grasshopper_plugin/opennest_win" $false
          Build-Pkg "yak_mac_rh8" "mac" "rh8_0" "src/opennest_2/bin/Release/net7.0"         "src/opennest_commands/bin/Release/net7.0"         "grasshopper_plugin/opennest_mac" $true
          Build-Pkg "yak_mac_rh9" "mac" "rh9_0" "src/opennest_2/bin/Release/net7.0"         "src/opennest_commands/bin/Release/net8.0"         "grasshopper_plugin/opennest_mac" $true

      # NOTE: there is no longer a separate auto-loading "OpenNest_GH2" Yak package. A GH2 .rhp delivered as a
      # registered Yak plug-in is scanned by Rhino's plug-in manager, which crashes on it
      # (Rhino.PlugIns.PlugIn.InternalOnLoad NRE -> "application initialization failed"). Instead the GH2 files
      # ride along inside the main OpenNest package's "grasshopper2/" subfolder (staged in steps 6/7): downloaded
      # with the GH1 + command install, but NOT auto-loaded. Rhino-9 users load opennest_gh2.rhp manually in
      # Grasshopper 2 (see grasshopper_plugin/GRASSHOPPER2_INSTALL.txt).

      # ---- 8) Push all four OpenNest distributions (rh8 + rh9, win + mac — same version) ----
      - name: Yak push (OpenNest, R8+R9, win+mac)
        if: ${{ env.YAK_TOKEN != '' }}
        shell: pwsh
        run: |
          Get-ChildItem yak_win_rh8/*.yak, yak_win_rh9/*.yak, yak_mac_rh8/*.yak, yak_mac_rh9/*.yak -ErrorAction SilentlyContinue | ForEach-Object {
            & "$env:GITHUB_WORKSPACE/yak.exe" push $_.FullName
          }

      # ---- 9) Refresh the committed installable packages in grasshopper_plugin/ (rh8 + rh9 per OS) ----
      - name: Refresh grasshopper_plugin packages
        shell: pwsh
        run: |
          Remove-Item grasshopper_plugin/opennest_win/*.yak -Force -ErrorAction SilentlyContinue
          Remove-Item grasshopper_plugin/opennest_mac/*.yak -Force -ErrorAction SilentlyContinue
          Copy-Item yak_win_rh8/*.yak, yak_win_rh9/*.yak grasshopper_plugin/opennest_win/ -Force
          Copy-Item yak_mac_rh8/*.yak, yak_mac_rh9/*.yak grasshopper_plugin/opennest_mac/ -Force

      # ---- 9b) Auto-maintain CHANGELOG.md: prepend this version's changes (commits since the previous tag,
      #          excluding the Release/[skip ci] noise) so every release is connected to what changed. ----
      - name: Update CHANGELOG
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.version }}"
          $date = (Get-Date -Format 'yyyy-MM-dd')
          $prev = (git describe --tags --abbrev=0 2>$null)
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $changes = git log $range --no-merges --pretty=format:"%s" |
            Where-Object { $_ -and ($_ -notmatch '^\s*Release v') -and ($_ -notmatch '\[skip ci\]') } |
            ForEach-Object { "- $_" }
          if (-not $changes) { $changes = @("- Maintenance release (no functional changes).") }
          $entry = "## [$ver] - $date`n" + ($changes -join "`n") + "`n`n"
          $cl = "CHANGELOG.md"
          if (Test-Path $cl) {
            $raw = Get-Content $cl -Raw
            $idx = $raw.IndexOf("`n## [")           # insert above the newest existing version section
            if ($idx -ge 0) {
              Set-Content $cl ($raw.Substring(0, $idx + 1) + $entry + $raw.Substring($idx + 1)) -NoNewline
            } else { Add-Content $cl ("`n" + $entry) }
          } else {
            Set-Content $cl ("# Changelog`n`n" + $entry) -NoNewline
          }
          Write-Host "CHANGELOG updated for $ver`:"; Write-Host ($changes -join "`n")

      # ---- 10) Commit the version bump + refreshed packages + changelog, tag, push ----
      - name: Commit + tag
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A grasshopper_plugin CHANGELOG.md
          git commit -m "Release v${{ steps.ver.outputs.version }} [skip ci]"
          # A concurrent push (e.g. a docs edit) may have moved main; rebase the release commit on top so
          # the push fast-forwards. Tag AFTER the rebase so the tag points at the final commit.
          git pull --rebase origin main
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main --tags

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true   # auto release notes (commits since last release) on the Release page
          files: |
            yak_win/*.yak
            yak_mac/*.yak
