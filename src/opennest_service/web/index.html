<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenNest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' fill='none' stroke='black' stroke-width='2'/%3E%3Crect x='4' y='4' width='5' height='4' fill='black'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>OpenNest</h1>
  <nav><a id="latestViewer" href="#" target="_blank" rel="noopener" hidden>latest result</a></nav>
</header>

<main>
  <section id="loginCard" class="card">
    <div class="row">
      <label class="grow">Password
        <input id="password" type="password" autocomplete="current-password">
      </label>
      <button id="login" type="button" class="primary">Unlock</button>
    </div>
    <p id="loginInfo" class="muted"></p>
  </section>

  <div id="app" hidden>
  <section class="card">
    <div class="row">
      <label class="grow">Session file (.pb) — closed polylines are parts, group <code>sheets</code> holds the sheets
        <input id="file" type="file" accept=".pb">
      </label>
    </div>
    <div class="grid">
      <label>Spacing between parts <input id="spacing" type="number" step="any" min="0" value="5"></label>
      <label>Margin to sheet edge <input id="margin" type="number" step="any" min="0" value="10"></label>
      <label>Rotation
        <select id="rotations">
          <option value="0">free</option>
          <option value="4">90° steps</option>
          <option value="2">180° steps</option>
          <option value="1">none</option>
        </select>
      </label>
      <label>Strategy
        <select id="fitMode">
          <option value="0">sheet by sheet (fast)</option>
          <option value="2">global bin pack</option>
          <option value="3" selected>group-and-fill (best, slowest)</option>
        </select>
      </label>
      <label>Time budget
        <select id="wall">
          <option value="60">1 minute</option>
          <option value="300">5 minutes</option>
          <option value="900" selected>15 minutes</option>
          <option value="1800">30 minutes</option>
          <option value="3600">60 minutes</option>
        </select>
      </label>
      <label>Seed <input id="seed" type="number" min="0" value="1"></label>
    </div>
    <div class="row">
      <button id="run" type="button" class="primary" disabled>Nest</button>
      <button id="cancel" type="button" hidden>Cancel</button>
      <span id="status" class="muted"></span>
    </div>
    <div class="bar" id="progress" hidden><div id="barFill"></div></div>
    <iframe id="jobFrame" class="viewer" title="session viewer" hidden></iframe>
    <div id="resultLinks" class="row wrap" hidden>
      <a id="openViewer" target="_blank" rel="noopener">open in viewer</a>
      <a id="dlPb" download>result.pb</a>
      <a id="dlJson" download>result.json</a>
      <a id="dlLog" target="_blank" rel="noopener">solver log</a>
    </div>
  </section>

  <section class="card">
    <h2>Jobs</h2>
    <table id="jobs" class="jobs"><tbody></tbody></table>
  </section>
  </div>

  <section id="log" class="card" hidden>
    <ul id="messages"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
